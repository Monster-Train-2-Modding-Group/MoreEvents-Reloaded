[config]
schemaVersion = "0.0.1"

[package]
namespace = "Conductor"
name = "MoreEvents_Reloaded"
versionNumber = "0.3.1"
description = "Ports of existing MT1 events (and new ones) for MT2"
websiteUrl = "https://github.com/Monster-Train-2-Modding-Group/MoreEvents-Reloaded"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
MT2-Trainworks_Reloaded = "0.7.25"
Conductor-Conductor = "0.5.13"
Conductor-EssenceData = "0.1.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./"

[[build.copy]]
source = "./plugin_build"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = [ "monster-train-2" ]

[publish.categories]
monster-train-2 = ["mods"]

